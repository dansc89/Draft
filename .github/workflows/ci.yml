name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  rust:
    name: Rust and interchange
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Linux native build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libx11-dev libxi-dev libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev python3-venv
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked
      - name: Generated drawing
        run: |
          mkdir -p dist
          cargo run --locked -- --demo dist/demo
      - name: Independent DXF and PDF readers
        run: |
          python3 -m venv /tmp/draft-verify
          /tmp/draft-verify/bin/pip install ezdxf pypdf
          /tmp/draft-verify/bin/python scripts/test_verify_demo.py
          /tmp/draft-verify/bin/python scripts/verify-demo.py dist/demo
      - name: Generated interchange evidence
        uses: actions/upload-artifact@v4
        with:
          name: draft-proof-drawings
          path: dist/demo/
          if-no-files-found: error
